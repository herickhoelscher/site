name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Garimpo
        run: |
          mkdir -p garimpo
          node garimpo.cjs || true
          # Pinterest: RSS e pastas pela API pública
          curl -sSL -A "Mozilla/5.0" "https://br.pinterest.com/herickneumann4/feed.rss" -o garimpo/pinterest-feed.rss || true
          curl -sSL -A "Mozilla/5.0" -G "https://br.pinterest.com/resource/BoardsResource/get/" --data-urlencode 'data={"options":{"username":"herickneumann4","page_size":50,"privacy_filter":"public","field_set_key":"profile_grid_item"}}' -o garimpo/pinterest-boards.json || true
          ls -la garimpo
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garimpo
          git commit -q -m "garimpo" && git push
