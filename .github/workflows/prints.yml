name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p garimpo
          npm init -y >/dev/null
          npm i playwright@1.49.1 > garimpo/npm.log 2>&1
          npx playwright install --with-deps chromium >> garimpo/npm.log 2>&1
          tail -5 garimpo/npm.log
      - name: Olhar o Lado B (rede de verdade)
        run: |
          rm -rf olhar; mkdir -p olhar
          git clone -q --depth 1 https://github.com/herickhoelscher/site.git /tmp/site
          (cd /tmp/site && npm install --no-audit --no-fund >/dev/null 2>&1 && npm run build >/dev/null 2>&1 && (npx vite preview --port 4173 --strictPort > /tmp/prev.log 2>&1 &))
          sleep 6
          node olhar.cjs > olhar/log.txt 2>&1 || true
          git -C /tmp/site log --oneline -1 >> olhar/log.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garimpo olhar
          git commit -q -m "garimpo 2" && git push
