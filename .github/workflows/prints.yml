name: fotos
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar fotos (Unsplash License)
        run: |
          npm init -y > /dev/null && npm i playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node baixa.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos && rm -rf node_modules package.json package-lock.json
          git commit -q -m "fotos baixadas" && git push
