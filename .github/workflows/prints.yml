name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p garimpo
          npm init -y >/dev/null
          npm i playwright@1.49.1 > garimpo/npm.log 2>&1
          npx playwright install --with-deps chromium >> garimpo/npm.log 2>&1
          tail -5 garimpo/npm.log
      - name: Videos (Mixkit Free License)
        run: |
          rm -rf garimpo/videos; mkdir -p garimpo/videos
          for u in 99864/1717182517/99864 99868/1717182750/99868 99872/1717184136/99872; do
            id=${u##*/}
            curl -sSfL -o garimpo/videos/$id.mp4 "https://assets.mixkit.co/active_storage/video_items/$u-video-720.mp4" || echo "falhou $id" >> garimpo/log4.txt
          done
          ls -la garimpo/videos >> garimpo/log4.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garimpo
          git commit -q -m "garimpo 2" && git push
