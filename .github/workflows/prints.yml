name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p garimpo
          npm init -y >/dev/null
          npm i playwright@1.49.1 > garimpo/npm.log 2>&1
          npx playwright install --with-deps chromium >> garimpo/npm.log 2>&1
          tail -5 garimpo/npm.log
      - name: Garimpo 2
        run: |
          rm -rf garimpo/pins garimpo/videos
          node garimpo3.cjs > garimpo/log3.txt 2>&1 || true
          curl -sSL -A 'Mozilla/5.0' https://open.spotify.com/embed/playlist/75846hymUhaSBfAmvwGdp3 | grep -o '<script id="__NEXT_DATA__"[^>]*>.*</script>' | sed 's/<[^>]*script[^>]*>//g' > garimpo/herickfy.json || true
          for id in dhihVoP_6gw CMxAmnyYDLE DEgG-SfV_ko d1EnW4kn1kg 25XGPHY1TMM; do
            o=$(curl -sS "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" | head -c 400)
            mx=$(curl -s -o /dev/null -w "%{http_code}" "https://i.ytimg.com/vi/$id/maxresdefault.jpg")
            echo "$id max=$mx $o" >> garimpo/oembed2.txt
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garimpo
          git commit -q -m "garimpo 2" && git push
