name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p garimpo
          npm init -y >/dev/null
          npm i playwright@1.49.1 > garimpo/npm.log 2>&1
          npx playwright install --with-deps chromium >> garimpo/npm.log 2>&1
          tail -5 garimpo/npm.log
      - name: Garimpo 2
        run: |
          rm -rf garimpo/pins garimpo/videos
          node garimpo2.cjs > garimpo/log2.txt 2>&1 || true
          for id in x4ztgjvfU60 ax5YUmkWf_Y urV5GzXcXsQ Iwr1aLEDpe4 eXjbk-4ljgc MUCN-JwUvbY XuCfkgaaa08 qNMfF9TYETM aR-KAldshAE ZHhqwBwmRkI fnd71bqiiW0; do
            o=$(curl -sS "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" | head -c 400)
            mx=$(curl -s -o /dev/null -w "%{http_code}" "https://i.ytimg.com/vi/$id/maxresdefault.jpg")
            echo "$id max=$mx $o" >> garimpo/oembed.txt
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garimpo
          git commit -q -m "garimpo 2" && git push
