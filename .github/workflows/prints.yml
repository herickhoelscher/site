name: fotos
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar fotos (Unsplash License)
        run: |
          mkdir -p fotos
          while read nome foto; do
            [ -z "$nome" ] && continue
            curl -sSfL -o "fotos/$nome.jpg" "https://images.unsplash.com/$foto?fm=jpg&q=86&w=1800&fit=max" || echo "falhou $nome"
            echo "$nome $(stat -c %s fotos/$nome.jpg 2>/dev/null) $(file -b fotos/$nome.jpg | cut -c1-30)"
          done < lista.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git commit -q -m "fotos baixadas" && git push
