name: garimpo
on:
  push:
    branches: [prints]
permissions:
  contents: write
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p garimpo
          npm init -y >/dev/null
          npm i playwright@1.49.1 > garimpo/npm.log 2>&1
          npx playwright install --with-deps chromium >> garimpo/npm.log 2>&1
          tail -5 garimpo/npm.log
      - name: Spotify oEmbed
        run: |
          rm -rf garimpo/videos
          : > garimpo/spotify-oembed.txt
          while read id; do
            [ -z "$id" ] && continue
            echo "$id $(curl -sS "https://open.spotify.com/oembed?url=https://open.spotify.com/track/$id")" >> garimpo/spotify-oembed.txt
          done < spotify-ids.txt
          if [ -s spotify-playlist.txt ]; then
            pl=$(cat spotify-playlist.txt)
            curl -sSL -A 'Mozilla/5.0' "https://open.spotify.com/embed/playlist/$pl" | grep -o '<script id="__NEXT_DATA__"[^>]*>.*</script>' | sed 's/<[^>]*script[^>]*>//g' > garimpo/playlist.json || true
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garimpo
          git commit -q -m "garimpo 2" && git push
